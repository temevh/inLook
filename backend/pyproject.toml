[project]
name = "inlook-backend"
version = "0.0.0"
description = "Inlook backend: FastAPI, SSE event stream, Gemini + ElevenLabs STT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "httpx>=0.27",
  "google-genai>=1.0",
]

[project.optional-dependencies]
# UNCONFIRMED: MongoDB Atlas is not confirmed yet.
mongo = ["pymongo>=4.9"]

[tool.setuptools]
packages = ["app", "app.services"]
