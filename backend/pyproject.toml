[project]
name = "inlook-backend"
version = "0.0.0"
description = "Inlook backend: FastAPI, SSE event stream, Gemini + ElevenLabs STT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "google-genai>=1.0",
  "pymongo>=4.9",
  "httpx>=0.27",
  "websockets>=13",
]

[tool.setuptools]
packages = ["app", "app.services"]
