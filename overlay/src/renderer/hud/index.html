<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>inLook HUD</title>
<link rel="stylesheet" href="hud.css">
<script type="module" src="hud.js"></script>
</head>
<body>
<main class="strip">
  <header class="bar" id="bar" hidden>
    <span class="mark">inLook</span>
    <span class="status" id="status" data-tone="wait"><i class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></i><span id="status-text">Connecting…</span></span>
  </header>
  <section class="transcript" id="transcript" aria-label="Live transcript" hidden></section>
  <section class="cards" id="cards" aria-live="polite"></section>
</main>
</body>
</html>
