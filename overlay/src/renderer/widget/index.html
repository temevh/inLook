<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>inLook widget</title>
<link rel="stylesheet" href="widget.css">
<script type="module" src="widget.js"></script>
</head>
<body>
<main id="navball" class="navball" data-open="false">
  <p id="note" class="note" role="status" hidden></p>
  <button id="transcribe" class="bubble" aria-label="Transcribe" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
  <button id="selection" class="bubble" aria-label="Check selection"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8M8 20h8M12 4v16"/></svg></button>
  <button id="screen" class="bubble" aria-label="Check screenshot"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4M16 5h4v4M20 15v4h-4M8 19H4v-4"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
  <button id="quit" class="bubble" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button id="ball" class="ball" aria-label="inLook menu" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="badge" class="badge" hidden></span></button>
</main>
</body>
</html>
