: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"During a meeting, a spoken claim is spotted, matched against company memory, checked against the live source and judged outdated.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 1.2;\nconst T = grp(100, 170);\nmk(\"rect\", { width: 920, height: 680, rx: 18, class: \"box\" }, T);\nmk(\"path\", { class: \"detail\", d: \"M0,64 H920\" }, T);\ntxt(T, 32, 42, \"t-l\", \"Meeting · live transcript\", { style: \"font-size:22px\" });\nmk(\"circle\", { cx: 860, cy: 34, r: 7, fill: COL.bad }, T);\ntxt(T, 846, 41, \"t-m\", \"live\", { \"text-anchor\": \"end\", style: \"font-size:18px\" });\n\nconst l1 = faded(grp(40, 130, T));\ntxt(l1, 0, 0, \"t-m\", \"Anna\", { style: `fill:${COL.muted}; font-weight:600` });\ntxt(l1, 0, 40, \"t-l\", \"So for the enterprise push, how do we\");\ntxt(l1, 0, 76, \"t-l\", \"position on price?\");\n\nconst l2 = faded(grp(40, 300, T));\ntxt(l2, 0, 0, \"t-m\", \"Mikko\", { style: `fill:${COL.muted}; font-weight:600` });\nconst a = mk(\"text\", { x: 0, y: 40, class: \"t-l\" }, l2);\na.append(\"Like we said last week, \");\nconst c1 = mk(\"tspan\", {}, a); c1.textContent = \"we're €10 cheaper\";\nconst b = mk(\"text\", { x: 0, y: 76, class: \"t-l\" }, l2);\nconst c2 = mk(\"tspan\", {}, b); c2.textContent = \"than Competitor X\";\nb.append(\", so we lead with that.\");\nconst claim = col => { c1.style.fill = col || \"\"; c2.style.fill = col || \"\"; c1.style.transition = c2.style.transition = \"fill .4s\"; };\n\nconst note = faded(grp(40, 450, T));\n// HUD card: title, criticality, one-line fact (filled by Gemini from the card template)\nmk(\"rect\", { width: 840, height: 170, rx: 14, fill: \"#2a1618\", stroke: COL.bad, \"stroke-width\": 2.5 }, note);\ntxt(note, 28, 50, \"t-l\", \"Fact outdated\", { style: `fill:${COL.bad}` });\nmk(\"rect\", { x: 690, y: 22, width: 122, height: 36, rx: 18, fill: COL.bad }, note);\ntxt(note, 751, 47, \"t-col\", \"High\", { \"text-anchor\": \"middle\", style: `fill:${COL.bg}; font-size:15px` });\ntxt(note, 28, 100, \"t-val\", \"Competitor X: €59 → €39 per seat\", { style: \"font-size:26px\" });\ntxt(note, 28, 140, \"t-m\", \"Source: competitor's pricing page · checked now\", { style: \"font-size:18px\" });\n\nconst STEPS = [[\"bubble\", \"Claim spotted\", \"“€10 cheaper than X”\"], [\"db\", \"Found in memory\", \"Competitor price · €59\"], [\"web\", \"Source checked\", \"pricing page · €39\"], [\"tag\", \"Verdict\", \"outdated · high tier\"]];\nconst steps = STEPS.map(([k, t, d], i) => {\n  const y = 190 + i * 170;\n  const ic = icon(k, 1200, y);\n  const lab = grp(1360, y + 34);\n  txt(lab, 0, 0, \"t-l\", t);\n  const dd = faded(txt(lab, 0, 34, \"t-m\", d));\n  if (i) link(\"s\" + i, line(1260, y - 78, 1260, y));\n  return { ic, dd };\n});\nlink(\"in\", curve(1020, 520, 1200, 226));\n\nloop(async () => {\n  [l1, l2, note].forEach(e => show(e, false)); claim(); steps.forEach(s => { show(s.dd, false); s.ic.box.classList.remove(\"ok\", \"bad\", \"warn\"); });\n  await say(\"Inlook checks claims while the meeting is still going.\");\n  await wait(600); show(l1); await wait(1500); show(l2); await wait(1200);\n  claim(COL.warn);\n  await travel([\"in\"], COL.warn);\n  for (let i = 0; i < 4; i++) {\n    if (i) await travel([\"s\" + i], COL.warn, 7);\n    steps[i].ic.box.classList.add(i === 3 ? \"bad\" : \"warn\"); show(steps[i].dd);\n    await wait(500);\n  }\n  claim(COL.bad); show(note);\n  await wait(4200);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "07 · Reviewed update", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>07 · Reviewed update<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"A newer value arrives from the live source. Because the fact is high criticality, the new 39 euro version waits for review by the strategy owner; once accepted it supersedes the 59 euro version, which stays in the history, and the change is saved to company memory.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 1.3;\nconst web = icon(\"web\", 240, 418);\ntxt(web.g, 60, 124, \"t-m\", \"pricing page\", { \"text-anchor\": \"middle\", style: \"font-size:18px\" });\nconst db = icon(\"db\", 1520, 418);\ntxt(db.g, 60, 124, \"t-m\", \"company memory\", { \"text-anchor\": \"middle\", style: \"font-size:18px\" });\nconst saved = faded(txt(db.g, 60, 152, \"t-m\", \"saved\", { \"text-anchor\": \"middle\", style: `fill:${COL.ok}; font-weight:600; font-size:18px` }));\nlink(\"in\", curve(360, 460, 680, 375));\nlink(\"out\", curve(1240, 375, 1520, 460));\ntxt(L.nodes, 680, 250, \"t-col\", \"Version history\");\n\nfunction version(val, src) {\n  const g = mk(\"g\", {}, L.nodes);\n  const box = mk(\"rect\", { width: 560, height: 150, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: \"M1.5,17 Q1.5,1.5 17,1.5 H543 Q558.5,1.5 558.5,17 V40 H1.5 Z\", fill: COL.card2 }, g);\n  txt(g, 24, 27, \"t-col\", \"Competitor price\", { style: \"font-size:14px\" });\n  const pill = mk(\"rect\", { x: 380, y: 8, width: 164, height: 26, rx: 13, fill: COL.ok }, g);\n  const pt = txt(g, 462, 26, \"t-m\", \"\", { \"text-anchor\": \"middle\", style: `fill:${COL.bg}; font-weight:600; font-size:15px` });\n  txt(g, 24, 104, \"t-val\", val, { style: \"font-size:52px\" });\n  txt(g, 24, 134, \"t-m\", src, { style: \"font-size:17px\" });\n  const at = (y, op, ms = 700) => { g.style.transition = ms ? `transform ${ms}ms cubic-bezier(.16,1,.3,1), opacity ${ms}ms` : \"none\"; g.style.transform = `translate(680px,${y}px)`; g.style.opacity = op; };\n  const tag = (s, c) => { pt.textContent = s; pill.setAttribute(\"fill\", c); };\n  return { g, box, at, tag };\n}\nconst v1 = version(\"€59 / seat\", \"Tuesday's meeting · said by Mikko\");\nconst v2 = version(\"€39 / seat\", \"Live web · checked today\");\n// Review gate: a high-criticality fact waits for its strategy owners before the new version counts\nconst rv = faded(grp(680, 680));\nconst rvBox = mk(\"rect\", { width: 560, height: 76, rx: 38, class: \"box warn\" }, rv);\nconst rvDot = mk(\"circle\", { cx: 38, cy: 38, r: 8, fill: COL.warn }, rv);\nconst rvT = txt(rv, 62, 46, \"t-m\", \"\", { style: `fill:${COL.text}; font-size:21px; font-weight:600` });\nconst review = (s, c, cls) => { rvT.textContent = s; rvDot.setAttribute(\"fill\", c); rvBox.setAttribute(\"class\", \"box \" + cls); };\n\nsay(\"Reviewed by its owner, the fact updates and keeps its history.\");\nloop(async () => {\n  v1.at(300, 1, 0); v1.tag(\"v1 · current\", COL.ok);\n  v2.at(110, 0, 0); v2.tag(\"v2 · in review\", COL.warn); v2.box.classList.remove(\"ok\", \"warn\");\n  db.box.classList.remove(\"ok\"); show(saved, false); web.box.classList.remove(\"ok\"); show(rv, false);\n  await wait(1200);\n  flash(web.box, \"ok\", 900);\n  await travel([\"in\"], COL.web);\n  v1.at(480, .7);\n  v2.at(300, 1); v2.box.classList.add(\"warn\");\n  review(\"High criticality · strategy owners review\", COL.warn, \"warn\"); show(rv);\n  await wait(1800);\n  review(\"Accepted by Mikko · Q1 pricing owner\", COL.ok, \"ok\");\n  await wait(700);\n  v1.at(480, .45); v1.tag(\"v1 · superseded\", COL.muted);\n  v2.tag(\"v2 · current\", COL.ok); v2.box.classList.remove(\"warn\"); v2.box.classList.add(\"ok\");\n  await wait(700);\n  await travel([\"out\"]);\n  db.box.classList.add(\"ok\"); show(saved);\n  await wait(3600);\n  v2.box.classList.remove(\"ok\");\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "08 · Strategy flagged", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>08 · Strategy flagged<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"A high-criticality fact turns outdated and goes to review; the warning travels only to the two strategies built on it, and the third strategy stays healthy.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 2.6;\nconst F = [[\"Competitor price\", \"€59 / seat\", \"Tuesday's meeting\"], [\"Churn target\", \"3% / month\", \"Planning doc\"], [\"Launch date\", \"14 March\", \"Product sync\"], [\"Top customer ask\", \"Single sign-on\", \"Support chat\"]];\ntxt(L.nodes, 200, 180, \"t-col\", \"Facts\"); txt(L.nodes, 1260, 180, \"t-col\", \"Strategies\");\nconst facts = F.map((f, i) => tag(200, 212 + i * 170, ...f, 320));\n// Criticality per fact; any fact a strategy relies on is at least medium\nconst TIER = [\"High\", \"High\", \"Medium\", \"Medium\"];\nfacts.forEach((f, i) => {\n  mk(\"rect\", { x: 214, y: 8, width: 92, height: 22, rx: 11, fill: \"none\", stroke: TIER[i] === \"High\" ? COL.bad : COL.warn, \"stroke-width\": 1.5 }, f.g);\n  txt(f.g, 260, 24, \"t-col\", TIER[i], { \"text-anchor\": \"middle\", style: `font-size:12px; fill:${TIER[i] === \"High\" ? COL.bad : COL.warn}` });\n});\nconst S = [[\"Q1 pricing\", [0, 1]], [\"Enterprise push\", [0, 3]], [\"Spring launch\", [2, 3]]];\nconst strats = S.map(([name, uses], si) => {\n  const y = 212 + si * 230;\n  uses.forEach((fi, j) => link(`f${fi}s${si}`, curve(520, 270 + fi * 170, 1260, y + 50 + j * 50)));\n  return strategy(1260, y, name, 320, 190, 2, uses.map(fi => F[fi][0]));\n});\nsay(\"A high-criticality fact goes stale. Only its strategies are flagged.\");\nloop(async () => {\n  facts[0].box.classList.remove(\"bad\"); facts[0].v.style.fill = \"\"; facts[0].s.textContent = F[0][2]; facts[0].s.style.fill = \"\";\n  strats.forEach(s => { s.box.classList.remove(\"bad\", \"ok\"); s.blocks[0].classList.remove(\"bad\"); s.set(\"healthy\"); });\n  Object.values(P).forEach(p => p.classList.remove(\"bad\"));\n  await wait(1500);\n  facts[0].box.classList.add(\"bad\"); facts[0].v.style.fill = COL.bad;\n  facts[0].s.textContent = \"Outdated · in review\"; facts[0].s.style.fill = COL.bad;\n  await wait(800);\n  P.f0s0.classList.add(\"bad\"); P.f0s1.classList.add(\"bad\");\n  await Promise.all([travel([\"f0s0\"], COL.bad, 10, 8), travel([\"f0s1\"], COL.bad, 10, 8)]);\n  [0, 1].forEach(i => { strats[i].box.classList.add(\"bad\"); strats[i].blocks[0].classList.add(\"bad\"); strats[i].set(\"1 fact outdated\", COL.bad); });\n  strats[2].box.classList.add(\"ok\");\n  await wait(6000);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "09 · The right people", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>09 · The right people<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"A flagged strategy sends one review request, delivered only to the three people who own it; everyone else keeps working.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 1.8;\nconst s = strategy(120, 400, \"Q1 pricing\", 300, 200, 3, [\"Price\", \"Churn\", \"Margin\"]);\ns.box.classList.add(\"bad\"); s.blocks[0].classList.add(\"bad\"); s.set(\"1 fact outdated\", COL.bad);\ntxt(L.nodes, 120, 650, \"t-col\", \"Owners\", { style: \"font-size:14px\" });\ntxt(L.nodes, 120, 680, \"t-m\", \"Mikko · Anna · Eero\", { style: \"font-size:19px\" });\nconst msg = grp(530, 400);\nconst msgBox = mk(\"rect\", { width: 540, height: 260, rx: 20, class: \"box\" }, msg);\nmk(\"rect\", { x: 28, y: 28, width: 44, height: 44, rx: 12, fill: COL.ok }, msg);\ntxt(msg, 90, 46, \"t-l\", \"Inlook\", { style: \"font-size:22px\" });\ntxt(msg, 90, 72, \"t-m\", \"now\", { style: \"font-size:16px\" });\ntxt(msg, 28, 118, \"t-l\", \"Q1 pricing relies on a competitor\", { style: \"font-size:23px\" });\ntxt(msg, 28, 150, \"t-l\", \"price that changed today. Review it?\", { style: \"font-size:23px\" });\n[[\"Accept\", COL.ok, 28], [\"Reject\", COL.muted, 196]].forEach(([t, c, x]) => {\n  mk(\"rect\", { x, y: 184, width: 150, height: 48, rx: 24, fill: \"none\", stroke: c, \"stroke-width\": 2 }, msg);\n  txt(msg, x + 75, 215, \"t-l\", t, { \"text-anchor\": \"middle\", style: `font-size:19px; fill:${c}` });\n});\nlink(\"sm\", curve(420, 479, 530, 490));\nconst TEAMS = [[\"Sales\", [\"Mikko\", \"Anna\", \"Sara\"]], [\"Product\", [\"Otto\", \"Leena\", \"Ville\"]], [\"Finance\", [\"Eero\", \"Laura\", \"Petri\"]]];\nconst ppl = {};\nTEAMS.forEach(([name, names], ti) => Object.assign(ppl, teamRow(1180, 180 + ti * 240, 640, 200, name, names, [1070, 490], `${ti}`, 200)));\nconst WHO = [\"00\", \"01\", \"20\"];\nsay(\"Only its owners are asked to review. Everyone else keeps working.\");\nloop(async () => {\n  ghost(msg); msgBox.classList.remove(\"bad\");\n  Object.values(ppl).forEach(p => p.classList.remove(\"paged\", \"out\")); Object.keys(ppl).forEach(deact); P.sm.classList.remove(\"bad\");\n  await wait(900);\n  await travel([\"sm\"], COL.bad, 7, 8);\n  ghost(msg, false); msgBox.classList.add(\"bad\");\n  await wait(700);\n  Object.entries(ppl).forEach(([k, p]) => p.classList.toggle(\"out\", !WHO.includes(k)));\n  WHO.forEach(k => act(k, \"bad\"));\n  await Promise.all(WHO.map((k, i) => wait(i * 150).then(() => travel([k], COL.bad, 11, 8)).then(() => ppl[k].classList.add(\"paged\"))));\n  await wait(4200);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "10 · One shared memory", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>10 · One shared memory<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"Cross-section of a company building: what one team learns travels along the floor's corridor, through Inlook's shared memory, to the people on other floors who need it.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\n// The only scene with the building: Inlook is the shared spine between floors.\nTEMPO = 1.9;\nconst BX = 480, BW = 960, TOP = 250, FH = 150;\nconst FLOORS = [[\"Sales\", [\"Mikko\", \"Anna\", \"Sara\"]], [\"Product\", [\"Otto\", \"Leena\", \"Ville\"]], [\"Finance\", [\"Eero\", \"Laura\", \"Petri\"]], [\"Support\", [\"Kaisa\", \"Antti\", \"Riikka\"]]];\nmk(\"path\", { class: \"box\", d: `M${BX},${TOP} L${BX + BW / 2},${TOP - 110} L${BX + BW},${TOP} V${TOP + FH * 4} H${BX} Z` }, L.links);\nFLOORS.forEach((_, i) => { if (i) mk(\"path\", { class: \"detail\", d: `M${BX},${TOP + i * FH} H${BX + BW - 180}` }, L.links); });\nconst SX = BX + BW - 180, MID = SX + 90;\nmk(\"rect\", { x: SX, y: TOP, width: 180, height: FH * 4, fill: \"#13211e\", stroke: COL.ok, \"stroke-width\": 2.5 }, L.links);\nmk(\"path\", { d: `M${MID},${TOP + 100} V${TOP + FH * 4 - 16}`, stroke: \"#2f6f61\", \"stroke-width\": 3, \"stroke-dasharray\": \"2 8\", \"stroke-linecap\": \"round\", fill: \"none\" }, L.links);\ntxt(L.nodes, MID, TOP + 44, \"t-l\", \"Inlook\", { \"text-anchor\": \"middle\", style: \"font-weight:800\" });\ntxt(L.nodes, MID, TOP + 72, \"t-m\", \"shared memory\", { \"text-anchor\": \"middle\", style: \"font-size:17px\" });\nconst px = j => BX + 70 + j * 200, walk = fi => TOP + fi * FH + 132;\nconst ppl = {};\nFLOORS.forEach(([name, names], fi) => {\n  const y = TOP + fi * FH;\n  txt(L.nodes, BX + 28, y + 40, \"t-col\", name);\n  // corridor: each desk drops to the floor's walkway, which runs into the Inlook spine\n  mk(\"path\", { class: \"detail\", d: `M${px(0)},${walk(fi)} H${MID} ` + names.map((_, j) => `M${px(j)},${y + 116} V${walk(fi)}`).join(\" \") }, L.links);\n  n
