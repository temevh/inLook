const D = [{"title": "01 · Capture", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>01 · Capture<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"Meetings, chat threads and documents flow into Inlook and come out as facts.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 1.7;\nconst sp = speech(160, 300, \"Meetings\"), ch = chat(160, 480, \"Chat threads\"), dc = doc(160, 660, \"Documents\");\nconst c = core(800, 390, 300, 240);\nlink(\"a\", curve(400, 345, 800, 450)); link(\"b\", curve(410, 525, 800, 510)); link(\"c\", curve(400, 715, 800, 570));\nconst F = [[\"Competitor price\", \"€59 / seat\", \"Tuesday's meeting\"], [\"Churn target\", \"3% / month\", \"Planning doc\"], [\"Top customer ask\", \"Single sign-on\", \"Support chat\"]];\nconst tags = F.map((f, i) => { link(\"f\" + i, curve(1100, 470 + i * 40, 1400, 330 + i * 180)); return tag(1400, 272 + i * 180, ...f); });\nconst order = [[sp, \"a\"], [dc, \"c\"], [ch, \"b\"]];\nsay(\"Inlook turns what teams say and write into facts.\");\nloop(async () => {\n  tags.forEach(t => ghost(t.g)); c.status(\"listening\");\n  await wait(900);\n  for (let i = 0; i < 3; i++) {\n    const [src, k] = order[i];\n    flash(src.box, \"ok\", 700);\n    await travel([k]);\n    flash(c.box); c.status(\"capturing…\", COL.warn);\n    await travel([\"f\" + i]);\n    ghost(tags[i].g, false); flash(tags[i].box, \"ok\", 900); c.status(\"listening\");\n    await wait(400);\n  }\n  await wait(3000);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "02 · Memory", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>02 · Memory<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"Facts flow into the company memory database. New facts are added, existing ones are updated in place, and retracted ones are removed.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 1.7;\nconst inTag = tag(120, 452, \"\", \"\", \"\");\nlink(\"in\", curve(400, 510, 700, 510));\nconst db = cylinder(700, 210, 520, 600);\ntxt(db.g, 260, 96, \"t-l\", \"Company memory\", { \"text-anchor\": \"middle\" });\nconst rows = mk(\"g\", { transform: \"translate(740,330)\" }, L.nodes);\nconst ctrG = grp(1340, 380);\ntxt(ctrG, 0, 0, \"t-m\", \"facts remembered\");\nconst ctrA = txt(ctrG, 0, 70, \"t-val\", \"1,284\", { style: \"font-size:64px\" });\ntxt(ctrG, 0, 150, \"t-m\", \"updated this week\");\nconst ctrU = txt(ctrG, 0, 220, \"t-val\", \"37\", { style: `font-size:64px; fill:${COL.ok}` });\n\nlet data = [\n  [\"Competitor price\", \"€59\", \"Mikko · meeting · Tue\"], [\"Churn target\", \"3%\", \"Planning doc\"],\n  [\"Top customer ask\", \"SSO\", \"Support chat\"], [\"Renewal rate\", \"92%\", \"Quarterly deck\"],\n];\n// [kind, label, value, source]\nconst EVENTS = [\n  [\"add\", \"Launch date\", \"14 Mar\", \"Product sync\"],\n  [\"upd\", \"Churn target\", \"2.5%\", \"Planning doc · revised\"],\n  [\"del\", \"Renewal rate\", \"92%\", \"Quarterly deck · retracted\"],\n  [\"add\", \"Hiring budget\", \"6 roles\", \"Finance review\"],\n  [\"upd\", \"Competitor price\", \"€39\", \"Live web · today\"],\n  [\"add\", \"Enterprise seats\", \"250\", \"Sales call\"],\n  [\"upd\", \"Top customer ask\", \"SSO, SCIM\", \"Support chat · revised\"],\n];\nfunction render(hl, old) {\n  rows.replaceChildren();\n  data.slice(0, 6).forEach(([l, v, s], k) => {\n    const isNew = hl === \"add\" && k === 0, isUpd = hl === \"upd\" && l === old.l, isDel = hl === \"del\" && l === old.l;\n    const g = mk(\"g\", { transform: `translate(0,${k * 70})`, class: isNew ? \"fade hide\" : \"\" }, rows);\n    const r = mk(\"rect\", { width: 440, height: 58, rx: 10, fill: isDel ? \"#2a1618\" : COL.card2, stroke: isUpd ? COL.ok : isDel ? COL.bad : \"none\", \"stroke-width\": 2 }, g);\n    if (isDel) { g.classList.add(\"fade\"); mk(\"path\", { d: \"M14,30 H426\", stroke: COL.bad, \"stroke-width\": 2.5 }, g); }\n    txt(g, 18, 26, \"t-m\", l, { style: `fill:${COL.text}; font-size:18px; font-weight:600` });\n    txt(g, 18, 47, \"t-m\", s, { style: \"font-size:14px\" });\n    const vt = txt(g, 422, 38, \"t-val\", v, { \"text-anchor\": \"end\", style: `font-size:22px;${isUpd ? `fill:${COL.ok}` : \"\"}` });\n    if (isUpd) {\n      const ox = 422 - vt.getComputedTextLength() - 14;\n      const ot = txt(g, ox, 38, \"t-val\", old.v, { \"text-anchor\": \"end\", style: `font-size:18px; fill:${COL.muted}` });\n      const w = ot.getComputedTextLength();\n      mk(\"path\", { d: `M${ox - w - 2},32 H${ox + 2}`, stroke: COL.bad, \"stroke-width\": 2.5 }, g);\n      setTimeout(() => r.setAttribute(\"stroke\", \"none\"), 1400 / TEMPO);\n    }\n    if (isNew) requestAnimationFrame(() => requestAnimationFrame(() => show(g)));\n  });\n}\nrender();\nsay(\"Facts are added, updated and removed as the company learns.\");\nlet i = 0, nA = 1284, nU = 37;\nloop(async () => {\n  const [kind, l, v, s] = EVENTS[i++ % EVENTS.length];\n  const tone = { add: [COL.ok, \"ok\", \"\"], upd: [COL.warn, \"warn\", \"update · \"], del: [COL.bad, \"bad\", \"remove · \"] }[kind];\n  inTag.set(l, v, tone[2] + s); flash(inTag.box, tone[1], 800);\n  await wait(400);\n  await travel([\"in\"], tone[0]);\n  flash(db.box, \"ok\", 500);\n  if (kind === \"add\") {\n    data.unshift([l, v, s]); render(\"add\"); ctrA.textContent = (++nA).toLocaleString(\"en\");\n  } else if (kind === \"del\") {\n    render(\"del\", { l });\n    await wait(1100);\n    const g = [...rows.children][data.findIndex(d => d[0] === l)];\n    g.classList.add(\"hide\");\n    await wait(700);\n    data = data.filter(d => d[0] !== l); render(); ctrA.textContent = (--nA).toLocaleString(\"en\");\n  } else {\n    const row = data.find(d => d[0] === l), old = { l, v: row[1] };\n    row[1] = v; row[2] = s; render(\"upd\", old); ctrU.textContent = ++nU;\n  }\n  if (data.length > 6) data.length = 6;\n  if (i % EVENTS.length === 0) data = [[\"Competitor price\", \"€59\", \"Mikko · meeting · Tue\"], [\"Churn target\", \"3%\", \"Planning doc\"], [\"Top customer ask\", \"SSO\", \"Support chat\"], [\"Renewal rate\", \"92%\", \"Quarterly deck\"]];\n  await wait(1300);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "03 · Building blocks", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>03 · Building blocks<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"Four facts fill the foundation of a strategy, which becomes complete once all four are in place.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 2.6;\nconst F = [[\"Competitor price\", \"€59 / seat\", \"Tuesday's meeting\"], [\"Churn target\", \"3% / month\", \"Planning doc\"], [\"Win rate vs. X\", \"34%\", \"Sales review\"], [\"Margin floor\", \"62%\", \"Finance review\"]];\nconst S = grp(1060, 190);\nconst card = mk(\"g\", {}, S);\nconst cardBox = mk(\"rect\", { width: 600, height: 210, rx: 20, class: \"box\" }, card);\nmk(\"path\", { d: \"M540,36 V84 M540,36 H572 L564,48 L572,60 H540\", fill: \"none\", stroke: COL.muted, \"stroke-width\": 3, \"stroke-linejoin\": \"round\" }, card);\ntxt(card, 40, 106, \"t-xl\", \"Q1 pricing\", { style: \"font-size:46px\" });\nconst st = txt(card, 40, 154, \"t-m\", \"\", { style: \"font-weight:600; font-size:22px\" });\nconst slots = F.map((f, i) => {\n  const g = grp(0, 226 + i * 68, S);\n  mk(\"rect\", { width: 600, height: 56, rx: 12, class: \"box dashed\", style: `fill:${COL.bg}` }, g);\n  const fill = faded(mk(\"g\", {}, g));\n  mk(\"rect\", { width: 600, height: 56, rx: 12, class: \"box ok\", style: `fill:${COL.card2}` }, fill);\n  txt(fill, 22, 34, \"t-col\", f[0], { style: \"font-size:14px\" });\n  txt(fill, 578, 37, \"t-val\", f[1], { \"text-anchor\": \"end\", style: \"font-size:24px\" });\n  return fill;\n});\nconst tags = F.map((f, i) => { const cy = 278 + i * 160; link(\"f\" + i, curve(420, cy, 1060, 444 + i * 68)); return tag(140, cy - 58, ...f); });\nsay(\"Facts become the building blocks of strategy.\");\nloop(async () => {\n  slots.forEach(s => show(s, false)); ghost(card);\n  st.textContent = \"missing 4 building blocks\"; st.style.fill = COL.muted;\n  Object.values(P).forEach(p => p.classList.remove(\"live\"));\n  await wait(900);\n  for (let i = 0; i < 4; i++) {\n    flash(tags[i].box, \"ok\", 700); P[\"f\" + i].classList.add(\"live\");\n    await travel([\"f\" + i]);\n    show(slots[i]);\n    st.textContent = i < 3 ? `missing ${3 - i} building block${3 - i > 1 ? \"s\" : \"\"}` : \"\";\n    await wait(150);\n  }\n  ghost(card, false); cardBox.classList.add(\"ok\");\n  st.textContent = \"healthy · built on 4 facts\"; st.style.fill = COL.ok;\n  await wait(5600);\n  cardBox.classList.remove(\"ok\");\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "04 · Routing", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>04 · Routing<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"Inlook sends each fact only to the people across teams who rely on it; everyone else is left alone.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 2.2;\nconst c = core(120, 400, 300, 240);\nconst cur = tag(120, 230, \"\", \"\", \"\", 300);\nconst TEAMS = [[\"Sales\", [\"Mikko\", \"Anna\", \"Sara\", \"Juho\"]], [\"Product\", [\"Otto\", \"Leena\", \"Ville\", \"Iida\"]], [\"Finance\", [\"Eero\", \"Laura\", \"Petri\", \"Noora\"]]];\nconst ppl = {};\nTEAMS.forEach(([name, names], ti) => Object.assign(ppl, teamRow(760, 220 + ti * 200, 1080, 170, name, names, [420, 520], `${ti}`)));\nconst ROUNDS = [\n  [[\"Competitor price\", \"€59 / seat\", \"Tuesday's meeting\"], [\"00\", \"01\", \"20\"]],\n  [[\"Churn target\", \"3% / month\", \"Planning doc\"], [\"20\", \"21\", \"10\"]],\n  [[\"Top customer ask\", \"Single sign-on\", \"Support chat\"], [\"10\", \"11\", \"12\", \"02\"]],\n];\nsay(\"Each fact reaches only the people who rely on it.\");\nlet r = 0;\nloop(async () => {\n  const [f, who] = ROUNDS[r++ % ROUNDS.length];\n  cur.set(...f); flash(cur.box, \"ok\", 700); c.status(\"routing…\", COL.warn);\n  Object.entries(ppl).forEach(([k, p]) => p.classList.toggle(\"out\", !who.includes(k)));\n  who.forEach(k => act(k, \"live\"));\n  await wait(600);\n  await Promise.all(who.map((k, i) => wait(i * 120).then(() => travel([k], COL.ok, 11)).then(() => ppl[k].classList.add(\"hit\"))));\n  c.status(\"delivered\");\n  await wait(2600);\n  Object.values(ppl).forEach(p => p.classList.remove(\"hit\", \"out\"));\n  Object.keys(ppl).forEach(deact);\n  await wait(500);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "05 · The world changes", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>05 · The world changes<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"Outside, a competitor drops its price from 59 to 39 euros. Inside the company, Inlook's memory still says 59.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 2;\ntxt(L.nodes, 120, 180, \"t-col\", \"Outside\");\ntxt(L.nodes, 1040, 180, \"t-col\", \"Inside the company\");\nmk(\"path\", { d: \"M960,190 V870\", class: \"team\" }, L.links);\nconst strikeFx = (plan) => mk(\"path\", { d: \"M34,166 L260,166\", stroke: COL.bad, \"stroke-width\": 8, \"stroke-dasharray\": 230, \"stroke-dashoffset\": 230, style: \"transition: stroke-dashoffset .5s cubic-bezier(.16,1,.3,1)\" }, plan);\nfunction panel(parent, title, val, sub) {\n  const p = grp(50, 170, parent);\n  mk(\"rect\", { width: 660, height: 360, rx: 16, fill: COL.card2 }, p);\n  txt(p, 40, 60, \"t-l\", title);\n  const v = txt(p, 40, 200, \"t-val\", val, { style: \"font-size:110px\" });\n  txt(p, 40, 250, \"t-m\", sub);\n  return { p, v };\n}\nfunction chipAt(parent, x, y, label, color, w) {\n  const c = faded(grp(x, y, parent));\n  mk(\"rect\", { width: w, height: 40, rx: 20, fill: color }, c);\n  txt(c, w / 2, 27, \"t-m\", label, { \"text-anchor\": \"middle\", style: `fill:${COL.bg}; font-weight:600; font-size:18px` });\n  return c;\n}\n\n// Outside: competitor's pricing page\nconst b = browser(120, 210, 760, 620, \"competitorx.com/pricing\");\ntxt(b.g, 50, 120, \"t-xl\", \"Pricing\");\nconst out = panel(b.g, \"Team plan\", \"€59\", \"per seat, per month\");\nconst strike = strikeFx(out.p);\nconst chip = chipAt(out.p, 40, 290, \"changed today\", COL.bad, 190);\n\n// Inside: the same fact as Inlook remembers it\nconst app = grp(1040, 210);\nmk(\"rect\", { width: 760, height: 620, rx: 14, class: \"box\" }, app);\nmk(\"path\", { class: \"detail\", d: \"M0,40 H760\" }, app);\nmk(\"rect\", { x: 18, y: 10, width: 20, height: 20, rx: 6, fill: COL.ok }, app);\ntxt(app, 50, 27, \"t-m\", \"Inlook · company memory\", { style: \"font-size:17px\" });\ntxt(app, 50, 120, \"t-xl\", \"What we know\");\nconst inn = panel(app, \"Competitor X · Team plan\", \"€59\", \"per seat · from Tuesday's meeting\");\nconst still = chipAt(inn.p, 40, 290, \"6 days old · not rechecked\", COL.warn, 300);\ntxt(app, 50, 580, \"t-m\", \"Used in  Q1 pricing  ·  Enterprise push\", { style: \"font-size:19px\" });\n\nloop(async () => {\n  out.v.textContent = \"€59\"; out.v.style.fill = \"\";\n  strike.style.transition = \"none\"; strike.setAttribute(\"stroke-dashoffset\", 230); strike.getBoundingClientRect(); strike.style.transition = \"stroke-dashoffset .5s cubic-bezier(.16,1,.3,1)\"; strike.style.opacity = 1;\n  show(chip, false); show(still, false);\n  await say(\"Outside, a competitor drops its price.\");\n  await wait(1600);\n  strike.setAttribute(\"stroke-dashoffset\", 0);\n  await wait(900);\n  strike.style.opacity = 0; out.v.textContent = \"€39\"; out.v.style.fill = COL.bad; show(chip);\n  await wait(2600);\n  await say(\"Inside, everyone still works from the old number.\");\n  show(still);\n  await wait(7000);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "06 · Live check", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>06 · Live check<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web
