ames.forEach((n, j) => { ppl[`${fi}${j}`] = person(px(j), y + 98, n); });\n});\nconst route = (from, to) => {\n  const [f1, j1] = [+from[0], +from[1]], [f2, j2] = [+to[0], +to[1]];\n  return `M${px(j1)},${TOP + f1 * FH + 116} V${walk(f1)} H${MID} V${walk(f2)} H${px(j2)} V${TOP + f2 * FH + 116}`;\n};\nconst ROUTES = [[\"00\", [\"11\"]], [\"20\", [\"01\"]], [\"11\", [\"30\", \"21\"]], [\"30\", [\"12\"]]];\nsay(\"What one team learns, every team that needs it can use.\");\nlet r = 0;\nloop(async () => {\n  const [from, tos] = ROUTES[r++ % ROUTES.length];\n  tos.forEach((t, i) => link(`r${i}`, route(from, t), \"link live\"));\n  ppl[from].classList.add(\"hit\");\n  await wait(400);\n  await Promise.all(tos.map((t, i) => travel([`r${i}`], COL.ok, 10).then(() => ppl[t].classList.add(\"hit\"))));\n  await wait(1200);\n  Object.values(ppl).forEach(p => p.classList.remove(\"hit\"));\n  tos.forEach((_, i) => P[`r${i}`].remove());\n  await wait(300);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "11 · From silos to sync", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>11 · From silos to sync<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>:root {\n  --bg: #0f1216; --card: #171b21; --card-2: #1f252e; --rule: #2b313b;\n  --text: #eceef1; --muted: #8f97a3; --ok: #5fd4b4; --warn: #f0b44c; --bad: #ff5d5d; --web: #7aa7ff;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml, body { height: 100%; background: var(--bg); overflow: hidden; }\nbody { display: grid; place-items: center; font-family: \"Schibsted Grotesk\", system-ui, sans-serif; }\nsvg { width: 100vw; height: 100vh; display: block; }\n::selection { background: var(--ok); color: var(--bg); }\n\n.box { fill: var(--card); stroke: var(--rule); stroke-width: 2.5; stroke-linejoin: round; transition: stroke .5s, fill .5s; }\n.box.ok { stroke: var(--ok); }\n.box.warn { stroke: var(--warn); }\n.box.bad { stroke: var(--bad); fill: #2a1618; }\n.box.web { stroke: var(--web); }\n.box.dashed { fill: none; stroke-dasharray: 8 8; }\n.detail { fill: none; stroke: var(--rule); stroke-width: 2; }\n.team { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 6 8; }\n.wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; fill: var(--text); }\n.t-xl { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; fill: var(--text); }\n.t-l { font-weight: 600; font-size: 26px; fill: var(--text); }\n.t-m { font-weight: 400; font-size: 20px; fill: var(--muted); }\n.t-val { font: 500 24px \"JetBrains Mono\", monospace; fill: var(--text); transition: fill .4s; }\n.t-col { font-weight: 600; font-size: 17px; letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }\n.link { fill: none; stroke: var(--rule); stroke-width: 2.5; transition: stroke .5s, stroke-width .5s, opacity .5s; }\n.link.live { stroke: #2f6f61; stroke-width: 3; }\n.link.bad { stroke: var(--bad); stroke-width: 4; }\n.link.ghost { stroke: none; }\n.fade { transition: opacity .6s; }\n.hide { opacity: 0; }\n.person { transition: opacity .5s; }\n.person path, .person circle { fill: #2a313b; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }\n.person.hit path, .person.hit circle { fill: var(--ok); stroke: var(--ok); }\n.person.paged path, .person.paged circle { fill: var(--bad); stroke: var(--bad); }\n.person.out { opacity: .25; }\n.person text { font-weight: 600; font-size: 21px; fill: var(--text); stroke: none; }\n.caption { font-weight: 600; font-size: 42px; letter-spacing: -0.015em; fill: var(--text); transition: opacity .5s; }\n.ghost { opacity: .2; filter: grayscale(1); }\n.box, g { transition: opacity .5s, filter .5s, stroke .5s, fill .5s; }\n<\/style>\n<\/head>\n<body>\n<svg id=\"s\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" aria-label=\"Left: an organisation split into departments, like microservices, each holding its own copy of a fact; an update crawls between them, gets lost, and they end up with three different answers. Right: with Inlook, one update reaches the shared memory and every department that uses the fact gets it at once, in sync; a department that doesn't use it is left alone.\"><\/svg>\n<script>// Shared shapes + motion for the Inlook video scenes (1920×1080 SVG stage).\nconst NS = \"http://www.w3.org/2000/svg\";\nconst svg = document.getElementById(\"s\");\nconst COL = { bg: \"#0f1216\", card: \"#171b21\", card2: \"#1f252e\", rule: \"#2b313b\", text: \"#eceef1\", muted: \"#8f97a3\", ok: \"#5fd4b4\", warn: \"#f0b44c\", bad: \"#ff5d5d\", web: \"#7aa7ff\" };\n\nfunction mk(tag, a = {}, p = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }\nfunction txt(p, x, y, cls, s, extra = {}) { const e = mk(\"text\", { x, y, class: cls, ...extra }, p); e.textContent = s; return e; }\nconst L = { links: mk(\"g\"), pk: mk(\"g\"), nodes: mk(\"g\"), top: mk(\"g\") };\nfunction grp(x, y, p = L.nodes) { return mk(\"g\", { transform: `translate(${x},${y})` }, p); }\nconst P = {};\nfunction link(k, d, cls = \"link\") { return (P[k] = mk(\"path\", { d, class: cls }, L.links)); }\nconst curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; };\nconst vcurve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; };\nconst line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;\n\ntxt(L.top, 60, 84, \"wordmark\", \"Inlook\");\nconst caption = txt(L.top, 960, 1010, \"caption\", \"\", { \"text-anchor\": \"middle\" });\nlet TEMPO = 1; // per-scene speed multiplier\nconst wait = ms => new Promise(r => setTimeout(r, ms / TEMPO));\nasync function say(s) { caption.style.opacity = 0; await wait(350); caption.textContent = s; caption.style.opacity = 1; }\nconst flash = (el, cls = \"ok\", ms = 700) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };\nconst show = (el, on = true) => el.classList.toggle(\"hide\", !on);\nconst faded = el => { el.classList.add(\"fade\", \"hide\"); return el; };\nconst ghost = (el, on = true) => el.classList.toggle(\"ghost\", on);\nasync function loop(fn) { while (true) await fn(); }\n\n// ── Shapes ────────────────────────────────────────────────\nfunction speech(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M18,0 H222 Q240,0 240,18 V72 Q240,90 222,90 H74 L44,116 L48,90 H18 Q0,90 0,72 V18 Q0,0 18,0 Z\" }, g);\n  txt(g, 26, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction chat(x, y, label) {\n  const g = grp(x, y);\n  mk(\"path\", { class: \"box\", style: \"opacity:.6\", d: \"M34,-18 H236 Q250,-18 250,-4 V50 Q250,64 236,64 H34 Q20,64 20,50 V-4 Q20,-18 34,-18 Z\" }, g);\n  const box = mk(\"path\", { class: \"box\", d: \"M14,0 H216 Q230,0 230,14 V76 Q230,90 216,90 H200 L208,112 L176,90 H14 Q0,90 0,76 V14 Q0,0 14,0 Z\" }, g);\n  txt(g, 24, 56, \"t-l\", label);\n  return { g, box };\n}\nfunction doc(x, y, label) {\n  const g = grp(x, y);\n  const box = mk(\"path\", { class: \"box\", d: \"M0,0 H196 L240,44 V110 H0 Z\" }, g);\n  mk(\"path\", { class: \"detail\", d: \"M196,0 V44 H240 M26,76 H170 M26,92 H130\" }, g);\n  txt(g, 26, 52, \"t-l\", label);\n  return { g, box };\n}\nfunction browser(x, y, w, h, url = \"\") {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box web\" }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,40 H${w}` }, g);\n  [22, 44, 66].forEach(cx => mk(\"circle\", { cx, cy: 20, r: 6, fill: COL.web, opacity: .6 }, g));\n  if (url) txt(g, 90, 27, \"t-m\", url, { style: \"font-size:17px\" });\n  return { g, box };\n}\nfunction core(x, y, w = 280, h = 240) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 22, class: \"box\" }, g);\n  txt(g, 30, 64, \"t-xl\", \"Inlook\");\n  [\"capture\", \"check\", \"remember\"].forEach((s, i) => {\n    mk(\"circle\", { cx: 38, cy: 104 + i * 34, r: 5, fill: COL.ok }, g);\n    txt(g, 56, 111 + i * 34, \"t-m\", s);\n  });\n  const st = txt(g, 30, h - 22, \"t-m\", \"listening\", { style: `fill:${COL.ok}; font-weight:600` });\n  return { g, box, status: (s, c = COL.ok) => { st.textContent = s; st.style.fill = c; } };\n}\nfunction cylinder(x, y, w, h) {\n  const g = grp(x, y), ry = Math.min(28, w * .12);\n  const box = mk(\"path\", { class: \"box\", d: `M0,${ry} A${w / 2},${ry} 0 0,1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0,1 0,${h - ry} Z` }, g);\n  mk(\"path\", { class: \"detail\", d: `M0,${ry} A${w / 2},${ry} 0 0,0 ${w},${ry}` }, g);\n  return { g, box, ry };\n}\nfunction tag(x, y, label, val, src, w = 280, h = 116) {\n  // Fact card: labelled header band, value, source line\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: h, rx: 14, class: \"box\" }, g);\n  mk(\"path\", { d: `M1.5,15 Q1.5,1.5 15,1.5 H${w - 15} Q${w - 1.5},1.5 ${w - 1.5},15 V36 H1.5 Z`, fill: COL.card2 }, g);\n  mk(\"circle\", { cx: 20, cy: 19, r: 4, fill: COL.muted }, g);\n  const l = txt(g, 34, 25, \"t-col\", label, { style: \"font-size:13px\" });\n  const v = txt(g, 20, 76, \"t-val\", val, { style: \"font-size:26px\" });\n  const s = txt(g, 20, 102, \"t-m\", src, { style: \"font-size:16px\" });\n  return { g, box, l, v, s, set(label2, val2, src2) { l.textContent = label2; v.textContent = val2; s.textContent = src2; } };\n}\nfunction strategy(x, y, name, w = 260, h = 170, n = 3, labels = []) {\n  // Strategy: a card resting on a foundation of fact blocks\n  const g = grp(x, y), ch = h - 42;\n  const box = mk(\"rect\", { width: w, height: ch, rx: 16, class: \"box\" }, g);\n  mk(\"path\", { d: `M${w - 40},20 V48 M${w - 40},20 H${w - 20} L${w - 25},27 L${w - 20},34 H${w - 40}`, fill: \"none\", stroke: COL.muted, \"stroke-width\": 2.5, \"stroke-linejoin\": \"round\" }, g);\n  txt(g, 22, ch / 2 - 2, \"t-l\", name, { style: \"font-size:24px\" });\n  const st = txt(g, 22, ch / 2 + 30, \"t-m\", \"healthy\", { style: `fill:${COL.ok}; font-size:18px; font-weight:600` });\n  const bw = (w - (n - 1) * 8) / n;\n  const blocks = Array.from({ length: n }, (_, i) => mk(\"rect\", { x: i * (bw + 8), y: ch + 10, width: bw, height: 32, rx: 8, class: \"box\", style: `fill:${COL.card2}` }, g));\n  labels.forEach((t, i) => txt(g, i * (bw + 8) + bw / 2, ch + 31, \"t-m\", t, { \"text-anchor\": \"middle\", style: \"font-size:13px; font-weight:600\" }));\n  return { g, box, blocks, set(s, c = COL.ok) { st.textContent = s; st.style.fill = c; } };\n}\nconst house = strategy;\nfunction person(x, y, name, p = L.nodes) {\n  const g = mk(\"g\", { class: \"person\", transform: `translate(${x},${y})` }, p);\n  mk(\"circle\", { cx: 0, cy: -12, r: 10 }, g);\n  mk(\"path\", { d: \"M-17,16 Q-17,2 0,2 Q17,2 17,16 Z\" }, g);\n  if (name) txt(g, 28, 8, \"\", name);\n  return g;\n}\nfunction team(x, y, w, h, name) {\n  const g = grp(x, y);\n  mk(\"rect\", { width: w, height: h, rx: 18, class: \"team\" }, g);\n  txt(g, 22, 38, \"t-col\", name);\n  return g;\n}\n// A team as a row: a trunk line from `from` enters the row and runs along a corridor\n// under the people; each person hangs off it. Per-person paths stay invisible until routed.\nfunction teamRow(x, y, w, h, name, names, from, prefix, spacing = 240) {\n  team(x, y, w, h, name);\n  const busY = y + h - 24, py = y + h / 2 + 12, ppl = {};\n  const pxs = names.map((_, j) => x + 90 + j * spacing);\n  const trunk = curve(from[0], from[1], x, busY);\n  mk(\"path\", { d: trunk + ` H${pxs[pxs.length - 1]}`, class: \"link\" }, L.links);\n  mk(\"path\", { class: \"detail\", d: pxs.map(px => `M${px},${busY} V${py + 18}`).join(\" \") }, L.links);\n  names.forEach((n, j) => { const k = prefix + j; link(k, trunk + ` H${pxs[j]} V${py + 18}`, \"link ghost\"); ppl[k] = person(pxs[j], py, n); });\n  return ppl;\n}\nconst act = (k, cls) => P[k].setAttribute(\"class\", `link ${cls}`);\nconst deact = k => P[k].setAttribute(\"class\", \"link ghost\");\n\n// Small 120×88 icons for pipelines\nfunction icon(kind, x, y) {\n  const g = grp(x, y); let box;\n  if (kind === \"bubble\") box = mk(\"path\", { class: \"box\", d: \"M12,0 H108 Q120,0 120,12 V60 Q120,72 108,72 H40 L22,90 L26,72 H12 Q0,72 0,60 V12 Q0,0 12,0 Z\" }, g);\n  if (kind === \"db\") { box = mk(\"path\", { class: \"box\", d: \"M0,14 A60,14 0 0,1 120,14 V74 A60,14 0 0,1 0,74 Z\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,14 A60,14 0 0,0 120,14 M0,40 A60,14 0 0,0 120,40\" }, g); }\n  if (kind === \"web\") { box = mk(\"rect\", { width: 120, height: 84, rx: 10, class: \"box web\" }, g); mk(\"path\", { class: \"detail\", d: \"M0,24 H120\" }, g); [14, 28, 42].forEach(cx => mk(\"circle\", { cx, cy: 12, r: 4, fill: COL.web, opacity: .6 }, g)); }\n  if (kind === \"tag\") { box = mk(\"rect\", { width: 120, height: 84, rx: 12, class: \"box\" }, g); mk(\"path\", { d: \"M1.5,13 Q1.5,1.5 13,1.5 H107 Q118.5,1.5 118.5,13 V26 H1.5 Z\", fill: COL.card2 }, g); mk(\"path\", { class: \"detail\", d: \"M16,50 H90 M16,66 H64\" }, g); }\n  if (kind === \"strategy\") { box = mk(\"rect\", { width: 120, height: 58, rx: 12, class: \"box\" }, g); [0, 1, 2].forEach(i => mk(\"rect\", { x: i * 42, y: 66, width: 36, height: 22, rx: 6, class: \"box\", style: `fill:${COL.card2}` }, g)); }\n  return { g, box };\n}\n\n// ── Motion ────────────────────────────────────────────────\nconst movers = [];\nfunction travel(keys, color = COL.ok, speed = 9, r = 7) {\n  return new Promise(res => {\n    const segs = keys.map(k => { const rev = k[0] === \"~\"; const el = P[rev ? k.slice(1) : k]; return { el, rev, len: el.getTotalLength() }; });\n    const el = mk(\"circle\", { r, fill: color }, L.pk);\n    movers.push({ segs, i: 0, d: 0, speed: speed * TEMPO, el, res });\n  });\n}\nlet _last = performance.now();\n(function tick(now) {\n  const dt = Math.min(50, (now || _last) - _last) / 16.67; _last = now || _last;\n  for (let k = movers.length - 1; k >= 0; k--) {\n    const m = movers[k];\n    m.d += m.speed * dt;\n    while (m.i < m.segs.length && m.d >= m.segs[m.i].len) { m.d -= m.segs[m.i].len; m.i++; }\n    if (m.i >= m.segs.length) { m.el.remove(); movers.splice(k, 1); m.res(); continue; }\n    const s = m.segs[m.i], p = s.el.getPointAtLength(s.rev ? s.len - m.d : m.d);\n    m.el.setAttribute(\"cx\", p.x); m.el.setAttribute(\"cy\", p.y);\n  }\n  requestAnimationFrame(tick);\n})();\n<\/script>\n<script>\nTEMPO = 1.6;\nmk(\"path\", { class: \"detail\", d: \"M960,170 V900\" }, L.links);\ntxt(L.nodes, 110, 190, \"t-col\", \"Split into silos · like microservices\");\ntxt(L.nodes, 1000, 190, \"t-col\", \"With Inlook\");\n\nfunction dept(x, y, name, w = 300) {\n  const g = grp(x, y);\n  const box = mk(\"rect\", { width: w, height: 150, rx: 16, class: \"box\" }, g);\n  txt(g, 24, 44, \"t-l\", name, { style: \"font-size:23px\" });\n  const st = txt(g, w - 22, 44, \"t-m\", \"\", { \"text-anchor\": \"end\", style: \"font-size:16px; font-weight:600\" });\n  txt(g, 24, 84, \"t-col\", \"Competitor price\", { style: \"font-size:13px\" });\n  const v = txt(g, 24, 126, \"t-val\", \"\", { style: \"font-size:30px\" });\n  return { g, box, set(val, col = COL.text, s = \"\", sc = COL.muted) { v.textContent = val; v.style.fill = col; st.textContent = s; st.style.fill = sc; } };\n}\n\n// ---- Left: departments pass facts to each other point to point ----\nconst A = { s: dept(110, 240, \"Sales\"), p: dept(560, 240, \"Product\"), f: dept(110, 640, \"Finance\"), u: dept(560, 640, \"Support\") };\nlink(\"sp\", line(410, 315, 560, 315)); link(\"sf\", line(260, 390, 260, 640));\nlink(\"pu\", line(710, 390, 710, 640)); link(\"fu\", line(410, 715, 560, 715));\nlink(\"su\", line(410, 390, 560, 640)); link(\"pf\", line(560, 390, 410, 640));\nlink(\"lost\", line(260, 390, 260, 512), \"link ghost\");\nconst lostMark = faded(grp(260, 524));\nmk(\"path\", { d: \"M-12,-12 L12,12 M12,-12 L-12,12\", stroke: COL.bad, \"stroke-width\": 4, \"stroke-linecap\": \"round\" }, lostMark);\ntxt(lostMark, 26, 7, \"t-m\", \"lost in a thread\", { style: `fill:${COL.bad}; font-size:17px` });\nconst leftSt = faded(txt(L.nodes, 110, 906, \"t-l\", \"3 answers to one question · days late\", { style: `fill:${COL.bad}; font-size:24px` }));\n\n// ---- Right: one shared memory, synced in real time ----\nconst web = icon(\"web\", 1370, 236);\ntxt(L.nodes, 1430, 224, \"t-m\", \"source changes\", { \"text-anchor\": \"middle\", style: \"font-size:16px\" });\nconst C = core(1290, 400, 280, 240);\nconst B = { s: dept(1000, 230, \"Sales\", 280), p: dept(1580, 230, \"Product\", 280), f: dept(1000, 700, \"Finance\", 280), u: dept(1580, 700, \"Support\", 280) };\nlink(\"in\", line(1430, 336, 1430, 400));\nconst q = (x1, y1, x2, y2) => `M${x1},${y1} Q${x2},${y1} ${x2},${y2}`;\nlink(\"rs\", q(1290, 470, 1140, 384)); link(\"rp\", q(1570, 470, 1720, 384));\nlink(\"rf\", q(1290, 570, 1140, 696)); link(\"ru\", q(1570, 570, 1720, 696));\nconst rightSt = faded(txt(L.nodes, 1000, 906, \"t-l\", \"1 answer, everywhere it's used · seconds\", { style: `fill:${COL.ok}; font-size:24px` }));\n\nconst USES = [\"s\", \"p\", \"f\"]; // Support doesn't use this fact\n\nasync function left() {\n  A.s.set(\"€59\"); A.p.set(\"€59\"); A.f.set(\"€49\", COL.text); A.u.set(\"€59\");\n  Object.values(A).forEach(d => d.box.classList.remove(\"warn\", \"bad\"));\n  show(lostMark, false); show(leftSt, false); P.lost.setAttribute(\"class\", \"link ghost\");\n  await wait(1200);\n  A.s.set(\"€39\", COL.warn, \"heard on a call\", COL.warn); A.s.box.classList.add(\"warn\");\n  await wait(1400);\n  await travel([\"sp\"], COL.warn, 1.6);\n  A.p.set(\"€39\", COL.warn, \"2 days later\", COL.warn); A.p.box.classList.add(\"warn\");\n  await wait(600);\n  P.lost.setAttribute(\"class\", \"link bad\");\n  await travel([\"lost\"], COL.warn, 1.4);\n  show(lostMark);\n  A.f.set(\"€49\", COL.bad, \"stale\", COL.bad); A.f.box.classList.add(\"bad\");\n  A.u.set(\"€59\", COL.bad, \"never told\", COL.bad); A.u.box.classList.add(\"bad\");\n  await wait(500);\n  show(leftSt);\n}\n\nasync function right() {\n  Object.values(B).forEach(d => { d.set(\"€59\"); d.box.classList.remove(\"ok\"); ghost(d.g, false); });\n  [\"rs\", \"rp\", \"rf\", \"ru\"].forEach(k => P[k].setAttribute(\"class\", \"link\"));\n  C.status(\"listening\"); C.box.classList.remove(\"ok\"); web.box.classList.remove(\"ok\"); show(rightSt, false);\n  await wait(1200);\n  web.box.classList.add(\"ok\");\n  await travel([\"in\"], COL.web, 6);\n  C.box.classList.add(\"ok\"); C.status(\"fact updated · €39\");\n  ghost(B.u.g); P.ru.setAttribute(\"class\", \"link ghost\");\n  USES.forEach(k => act(\"r\" + k, \"live\"));\n  await Promise.all(USES.map(k => travel([\"r\" + k], COL.ok, 12).then(() => { B[k].set(\"€39\", COL.ok, \"synced · now\", COL.ok); B[k].box.classList.add(\"ok\"); })));\n  show(rightSt);\n}\n\nsay(\"Departments drift apart. Inlook keeps every one in sync, live.\");\nloop(async () => {\n  await Promise.all([left(), right()]);\n  await wait(5000);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Architecture", "doc": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Inlook · Architecture<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>\n  * { box-sizing: border-box; margin: 0; }\n  html, body { height: 100%; background: #0f1216; color: #eceef1; overflow: hidden; }\n  body { display: grid; place-items: center; }\n  svg { width: 100vw; height: 100vh; display: block; }\n<\/style>\n<\/head>\n<body>\n<svg viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"Inlook architecture. The desktop feeds the Electron overlay app on Debian X11, which posts to the Python FastAPI backend over HTTP and receives an SSE stream. The backend uses ElevenLabs for transcription and Gemini for claims, matching, verdicts and HUD cards. MongoDB and Context.dev are unconfirmed.\">\n<defs><marker id=\"h\" viewBox=\"0 0 12 12\" refX=\"10\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\"><path d=\"M1 1 L10 6 L1 11\" fill=\"none\" stroke=\"#dfe3e8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/marker><marker id=\"hm\" viewBox=\"0 0 12 12\" refX=\"10\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\"><path d=\"M1 1 L10 6 L1 11\" fill=\"none\" stroke=\"#a3abb7\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/marker><marker id=\"hw\" viewBox=\"0 0 12 12\" refX=\"10\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\"><path d=\"M1 1 L10 6 L1 11\" fill=\"none\" stroke=\"#f0b44c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/marker><\/defs>\n<rect x=\"80\" y=\"70\" width=\"480\" height=\"150\" rx=\"18\" fill=\"#0f1216\" stroke=\"#dfe3e8\" stroke-width=\"2.5\"/>\n<text x=\"320.0\" y=\"138\" fill=\"#eceef1\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"26\" font-weight=\"600\" letter-spacing=\"0.06em\" text-anchor=\"middle\">DESKTOP<\/text>\n<text x=\"320.0\" y=\"172\" fill=\"#a3abb7\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"16\" font-weight=\"400\" letter-spacing=\"0.08em\" text-anchor=\"middle\">MIC · HIGHLIGHTED TEXT · SCREENSHOTS<\/text>\n<rect x=\"80\" y=\"380\" width=\"480\" height=\"480\" rx=\"18\" fill=\"#0f1216\" stroke=\"#dfe3e8\" stroke-width=\"2.5\"/>\n<text x=\"320.0\" y=\"428\" fill=\"#eceef1\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"26\" font-weight=\"600\" letter-spacing=\"0.06em\" text-anchor=\"middle\">OVERLAY APP<\/text>\n<text x=\"320.0\" y=\"462\" fill=\"#a3abb7\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"16\" font-weight=\"400\" letter-spacing=\"0.08em\" text-anchor=\"middle\">ELECTRON · DEBIAN X11<\/text>\n<rect x=\"110\" y=\"500\" width=\"160\" height=\"330\" rx=\"14\" fill=\"#171b21\" stroke=\"#a3abb7\" stroke-width=\"2\"/>\n<text x=\"190.0\" y=\"640\" fill=\"#eceef1\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"20\" font-weight=\"600\" letter-spacing=\"0.06em\" text-anchor=\"middle\">HUD<\/text>\n<text x=\"190\" y=\"672\" fill=\"#a3abb7\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"16\" font-weight=\"400\" letter-spacing=\"0.08em\" text-anchor=\"middle\">SIDE STRIP<\/text>\n<text x=\"190\" y=\"698\" fill=\"#a3abb7\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"16\" font-weight=\"400\" letter-spacing=\"0.08em\" text-anchor=\"middle\">CLICK-<\/text>\n<text x=\"190\" y=\"724\" fill=\"#a3abb7\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"16\" font-weight=\"400\" letter-spacing=\"0.08em\" text-anchor=\"middle\">THROUGH<\/text>\n<rect x=\"370\" y=\"500\" width=\"160\" height=\"140\" rx=\"14\" fill=\"#171b21\" stroke=\"#a3abb7\" stroke-width=\"2\"/>\n<text x=\"450.0\" y=\"562\" fill=\"#eceef1\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"20\" font-weight=\"600\" letter-spacing=\"0.06em\" text-anchor=\"middle\">WIDGET<\/text>\n<text x=\"450.0\" y=\"596\" fill=\"#a3abb7\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"16\" font-weight=\"400\" letter-spacing=\"0.08em\" text-anchor=\"middle\">INTERACTIVE<\/text>\n<rect x=\"880\" y=\"450\" width=\"360\" height=\"300\" rx=\"18\" fill=\"#0f1216\" stroke=\"#dfe3e8\" stroke-width=\"2.5\"/>\n<text x=\"1060.0\" y=\"510\" fill=\"#eceef1\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"26\" font-weight=\"600\" letter-spacing=\"0.06em\" text-anchor=\"middle\">INLOOK BACKEND<\/text>\n<text x=\"1060.0\" y=\"544\" fill=\"#a3abb7\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"16\" font-weight=\"400\" letter-spacing=\"0.08em\" text-anchor=\"middle\">PYTHON · FASTAPI<\/text>\n<text x=\"1060\" y=\"590\" fill=\"#a3abb7\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.12em\" text-anchor=\"middle\">TIER ROUTING<\/text>\n<text x=\"1060\" y=\"620\" fill=\"#5fd4b4\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"17\" font-weight=\"400\" letter-spacing=\"0em\" text-anchor=\"middle\">Low · updates automatically<\/text>\n<text x=\"1060\" y=\"648\" fill=\"#f0b44c\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"17\" font-weight=\"400\" letter-spacing=\"0em\" text-anchor=\"middle\">Medium · reviewed by who stated it<\/text>\n<text x=\"1060\" y=\"676\" fill=\"#ff6b6b\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"17\" font-weight=\"400\" letter-spacing=\"0em\" text-anchor=\"middle\">High · strategy owners review,<\/text>\n<text x=\"1060\" y=\"700\" fill=\"#ff6b6b\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"17\" font-weight=\"400\" letter-spacing=\"0em\" text-anchor=\"middle\">strategies flagged, owners messaged<\/text>\n<rect x=\"600\" y=\"70\" width=\"380\" height=\"160\" rx=\"18\" fill=\"#0f1216\" stroke=\"#dfe3e8\" stroke-width=\"2.5\"/>\n<text x=\"790.0\" y=\"146\" fill=\"#eceef1\" font-family='\"Schibsted Grotesk\", system-ui, sans-serif' font-size=\"26\" font const v = document.getElementById("v"), n = document.getElementById("n"), hint = n.querySelector(".hint");
const btns = D.map((d, i) => { const b = document.createElement("button"); b.textContent = d.title; b.onclick = () => go(i); n.insertBefore(b, hint); return b; });
let cur = 0;
function go(i) {
  cur = (i + D.length) % D.length;
  v.srcdoc = D[cur].doc;
  btns.forEach((b, j) => b.setAttribute("aria-current", j === cur));
  btns[cur].scrollIntoView({ inline: "nearest", block: "nearest" });
  history.replaceState(null, "", "#" + (cur + 1));
}
function key(e) {
  if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
  else if (e.key === "f" || e.key === "F") (document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen());
}
addEventListener("keydown", key);
v.addEventListener("load", () => { try { v.contentWindow.addEventListener("keydown", key); } catch (_) {} });
go((parseInt(location.hash.slice(1)) || 1) - 1);
