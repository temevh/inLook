<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · The world changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Outside, a competitor drops its price from 59 to 39 euros. Inside the company, Inlook's memory still says 59."></svg>
<script src="kit.js"></script>
<script>
TEMPO = 2;
txt(L.nodes, 120, 180, "t-col", "Outside");
txt(L.nodes, 1040, 180, "t-col", "Inside the company");
mk("path", { d: "M960,190 V870", class: "team" }, L.links);
const strikeFx = (plan) => mk("path", { d: "M34,166 L260,166", stroke: COL.bad, "stroke-width": 8, "stroke-dasharray": 230, "stroke-dashoffset": 230, style: "transition: stroke-dashoffset .5s cubic-bezier(.16,1,.3,1)" }, plan);
function panel(parent, title, val, sub) {
  const p = grp(50, 170, parent);
  mk("rect", { width: 660, height: 360, rx: 16, fill: COL.card2 }, p);
  txt(p, 40, 60, "t-l", title);
  const v = txt(p, 40, 200, "t-val", val, { style: "font-size:110px" });
  txt(p, 40, 250, "t-m", sub);
  return { p, v };
}
function chipAt(parent, x, y, label, color, w) {
  const c = faded(grp(x, y, parent));
  mk("rect", { width: w, height: 40, rx: 20, fill: color }, c);
  txt(c, w / 2, 27, "t-m", label, { "text-anchor": "middle", style: `fill:${COL.bg}; font-weight:600; font-size:18px` });
  return c;
}

// Outside: competitor's pricing page
const b = browser(120, 210, 760, 620, "competitorx.com/pricing");
txt(b.g, 50, 120, "t-xl", "Pricing");
const out = panel(b.g, "Team plan", "€59", "per seat, per month");
const strike = strikeFx(out.p);
const chip = chipAt(out.p, 40, 290, "changed today", COL.bad, 190);

// Inside: the same fact as Inlook remembers it
const app = grp(1040, 210);
mk("rect", { width: 760, height: 620, rx: 14, class: "box" }, app);
mk("path", { class: "detail", d: "M0,40 H760" }, app);
mk("rect", { x: 18, y: 10, width: 20, height: 20, rx: 6, fill: COL.ok }, app);
txt(app, 50, 27, "t-m", "Inlook · company memory", { style: "font-size:17px" });
txt(app, 50, 120, "t-xl", "What we know");
const inn = panel(app, "Competitor X · Team plan", "€59", "per seat · from Tuesday's meeting");
const still = chipAt(inn.p, 40, 290, "6 days old · not rechecked", COL.warn, 300);
txt(app, 50, 580, "t-m", "Used in  Q1 pricing  ·  Enterprise push", { style: "font-size:19px" });

loop(async () => {
  out.v.textContent = "€59"; out.v.style.fill = "";
  strike.style.transition = "none"; strike.setAttribute("stroke-dashoffset", 230); strike.getBoundingClientRect(); strike.style.transition = "stroke-dashoffset .5s cubic-bezier(.16,1,.3,1)"; strike.style.opacity = 1;
  show(chip, false); show(still, false);
  await say("Outside, a competitor drops its price.");
  await wait(1600);
  strike.setAttribute("stroke-dashoffset", 0);
  await wait(900);
  strike.style.opacity = 0; out.v.textContent = "€39"; out.v.style.fill = COL.bad; show(chip);
  await wait(2600);
  await say("Inside, everyone still works from the old number.");
  show(still);
  await wait(7000);
});
</script>
</body>
</html>
